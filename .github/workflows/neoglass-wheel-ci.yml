name: NeoGlass Wheels · CI

# Este proyecto vive en apps/neoglass-wheel dentro del monorepo OmniRoute.
# El nombre del workflow es propio y el disparador lleva `paths` para no
# encadenarse con el CI de OmniRoute ni consumir minutos en cada push ajeno.

on:
  push:
    branches: ['**']
    paths:
      - 'apps/neoglass-wheel/**'
      - '.github/workflows/neoglass-wheel-ci.yml'
  pull_request:
    paths:
      - 'apps/neoglass-wheel/**'
      - '.github/workflows/neoglass-wheel-ci.yml'
  workflow_dispatch:

concurrency:
  group: neoglass-wheel-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/neoglass-wheel

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/neoglass-wheel/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validación HTML
        run: npm run lint:html

      - name: Shaders GLSL
        run: npm run check:shaders

      - name: Tests con cobertura
        run: npm run test:coverage

      - name: Build de producción
        run: npm run build

      - name: Presupuesto de rendimiento y auditoría estadística
        run: npm run report

      - name: Subir cobertura
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: neoglass-wheel-coverage
          path: apps/neoglass-wheel/coverage/
          if-no-files-found: ignore
