name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validación HTML
        run: npm run lint:html

      - name: Shaders GLSL
        run: npm run check:shaders

      - name: Tests con cobertura
        run: npm run test:coverage

      - name: Build de producción
        run: npm run build

      - name: Presupuesto de rendimiento y auditoría estadística
        run: npm run report

      - name: Subir cobertura
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
