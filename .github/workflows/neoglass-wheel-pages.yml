name: NeoGlass Wheels · Pages

# Publica únicamente la rueda. `dist` se resuelve dentro de apps/neoglass-wheel
# y no toca el sitio ni los artefactos que despliegue OmniRoute.
#
# AVISO: GitHub Pages es un destino por repositorio. Si OmniRoute ya publica su
# propio sitio en Pages, activar este workflow sustituiría ese sitio. Por eso
# queda en `workflow_dispatch` (solo manual) hasta que se decida el destino.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neoglass-wheel-pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/neoglass-wheel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/neoglass-wheel/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/neoglass-wheel/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
